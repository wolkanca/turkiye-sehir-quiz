<!-- Wolkanca Oyunları #03 — WordPress Özel HTML bloğu -->
<!-- GitHub Pages aktif olduktan sonra aşağıdaki iframe görüntülenir. -->
<div style="width:100%;max-width:1080px;margin-inline:auto">
  <iframe
    id="wolkanca-city-quiz"
    src="https://wolkanca.github.io/turkiye-sehir-quiz/"
    title="Türkiye'yi Ne Kadar Tanıyorsun? — Şehri Bul!"
    width="100%"
    height="920"
    loading="lazy"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="clipboard-write"
    style="display:block;width:100%;min-height:720px;border:0;border-radius:18px;background:#090f1d"
  ></iframe>
</div>
<script>
// WordPress bu script'i engellerse iframe sabit yüksekliğiyle çalışmaya devam eder.
(() => {
  const frame = document.getElementById('wolkanca-city-quiz');
  if (!frame) return;
  window.addEventListener('message', event => {
    if (event.source !== frame.contentWindow) return;
    if (event.origin !== new URL(frame.src).origin) return;
    if (event.data?.type !== 'wolkanca-city-quiz:height') return;
    const h = Number(event.data.height);
    if (Number.isFinite(h) && h >= 400 && h <= 2400) frame.style.height = Math.ceil(h + 8) + 'px';
  });
})();
</script>
